name: CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cc-kelompok-a-backend:main
            ghcr.io/${{ github.repository_owner }}/cc-kelompok-a-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cc-kelompok-a-frontend:main
            ghcr.io/${{ github.repository_owner }}/cc-kelompok-a-frontend:${{ github.sha }}

  notify:
    name: Notify or Manual Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deployment notice
        run: |
          echo "Images built and pushed to GHCR. No SSH deployment configured."
          echo "Set up your deployment platform (Railway, Heroku, etc.) to pull the pushed images."