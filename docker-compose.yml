services:
  database:
    image: postgres:16-alpine
    container_name: it_asset_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: it_asset_db
      POSTGRES_USER: it_asset
      POSTGRES_PASSWORD: it_asset_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it_asset_backend
    restart: unless-stopped
    environment:
      APP_NAME: IT Asset Management API
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://it_asset:it_asset_password@database:5432/it_asset_db
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it_asset_frontend
    restart: unless-stopped
    environment:
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000/api/v1}
      PORT: 80
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
